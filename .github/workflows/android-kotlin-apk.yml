name: android-kotlin-apk

# Builds the APK with the original egui UI plus Kotlin support. It never compiles Rust:
# libphotocraft_android.so comes from the artifact of the latest android-kotlin-so run.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP: apps/photocraft-android/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure the Android SDK and platform 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Find the latest core build
        id: core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/workflows/android-kotlin-so.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          test -n "$id"
          echo "run-id=$id" >> "$GITHUB_OUTPUT"
      - name: Download the prebuilt core
        uses: actions/download-artifact@v4
        with:
          name: photocraft-core-arm64
          run-id: ${{ steps.core.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.APP }}/app/src/main/jniLibs/arm64-v8a
      - name: Check the core
        run: |
          lib="${{ env.APP }}/app/src/main/jniLibs/arm64-v8a/libphotocraft_android.so"
          test -f "$lib"
          ls -l "$lib"
      - name: Build the APK (release)
        working-directory: ${{ env.APP }}
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/photocraft-ci.keystore" \
            -storepass photocraft-ci -keypass photocraft-ci -alias photocraft-ci \
            -dname "CN=PhotoCraft CI, O=PhotoCraft, C=US" -keyalg RSA -keysize 2048 -validity 10000
          gradle assembleRelease -PphotocraftStoreFile="$RUNNER_TEMP/photocraft-ci.keystore" --no-daemon
        env:
          PHOTOCRAFT_KEYSTORE_PASSWORD: photocraft-ci
          PHOTOCRAFT_KEY_ALIAS: photocraft-ci
          PHOTOCRAFT_KEY_PASSWORD: photocraft-ci
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-android-kotlin-arm64-apk
          path: ${{ env.APP }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
